<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="74%">
      <stop offset="0" stop-color="#20243a"/>
      <stop offset="0.58" stop-color="#1a1d2d"/>
      <stop offset="1" stop-color="#141621"/>
    </radialGradient>
    <linearGradient id="blue" x1="18%" y1="88%" x2="82%" y2="12%">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.55" stop-color="#6693f6"/>
      <stop offset="1" stop-color="#5a86ee"/>
    </linearGradient>
    <linearGradient id="green" x1="20%" y1="85%" x2="80%" y2="15%">
      <stop offset="0" stop-color="#9ece6a"/>
      <stop offset="1" stop-color="#b8ec68"/>
    </linearGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#090a12" flood-opacity="0.52"/>
    </filter>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#080a13" flood-opacity="0.42"/>
    </filter>
    <filter id="dotShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#080a13" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Transparent canvas; the app-icon squircle is geometrically centered. -->
  <rect x="64" y="64" width="896" height="896" rx="244"
        fill="url(#background)" filter="url(#outerShadow)"/>
  <rect x="66" y="66" width="892" height="892" rx="242"
        fill="none" stroke="#2a3048" stroke-width="4" opacity="0.52"/>

  <!-- Ring center: (512, 512). Gap and status dot sit together at upper-right. -->
  <path d="M 680.84 252.00 A 310 310 0 1 0 803.34 405.98"
        fill="none" stroke="url(#blue)" stroke-width="58"
        stroke-linecap="round" filter="url(#symbolShadow)"/>

  <!-- Check visible bounds: x=343…681, y=396…628; center: (512, 512). -->
  <path d="M 376 501 L 484 595 L 648 429"
        fill="none" stroke="url(#blue)" stroke-width="66"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#symbolShadow)"/>

  <circle cx="755" cy="319" r="42" fill="url(#green)" filter="url(#dotShadow)"/>
  <circle cx="746" cy="309" r="13" fill="#d6ff94" opacity="0.16"/>
</svg>
